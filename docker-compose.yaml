services:
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: cloudflared
    restart: ${RESTART_POLICY:-unless-stopped}
    command: tunnel --no-autoupdate run
    env_file:
      - secrets/cloudflared/cloudflared.env
    networks:
      - server

  cloudflared-ssh:
    image: cloudflare/cloudflared:2026.3.0
    container_name: cloudflared-ssh
    restart: ${RESTART_POLICY:-unless-stopped}
    command: tunnel --no-autoupdate run
    env_file:
      - secrets/cloudflared/cloudflared-ssh.env
    network_mode: host

  web:
    container_name: eventyrbaade
    image: eventyrbaade
    restart: unless-stopped
    networks:
      - server

networks:
  server:
    name: server
    driver: bridge
